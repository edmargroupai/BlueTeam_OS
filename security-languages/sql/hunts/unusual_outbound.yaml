id: sql.network.unusual_outbound
name: Unusual outbound transfer hunt
description: Large or repeated outbound flows to a single external destination.
security_domain: network
required_fields: [src_ip, dst_ip, category]
MITRE_mapping: [T1041]
performance_expectation: aggregation only
version: 1.0.0
parameters: [min_events]
defaults:
  min_events: 3
test_fixture: null
sql: |
  SELECT src_ip, dst_ip, COUNT(*) AS outbound_events
  FROM events
  WHERE category = 'network' AND dst_ip IS NOT NULL
  GROUP BY src_ip, dst_ip
  HAVING COUNT(*) >= :min_events
clickhouse_sql: |
  SELECT src_ip, dst_ip, count() AS outbound_events
  FROM blueteam.events
  WHERE tenant_id = {tenant_id:String} AND category = 'network' AND dst_ip != ''
  GROUP BY src_ip, dst_ip
  HAVING outbound_events >= {min_events:UInt32}

id: sql.identity.password_spray
name: Password spray hunt
description: Distinct failed-authentication users per source IP inside a window.
security_domain: identity
required_fields: [src_ip, user_name, outcome, category]
MITRE_mapping: [T1110.003]
performance_expectation: p95 under 2s on 100k auth events
version: 1.0.0
parameters: [min_users]
defaults:
  min_users: 5
test_fixture: blue_range/scenarios/identity/password_spray.yaml
sql: |
  SELECT src_ip, COUNT(DISTINCT user_name) AS distinct_users, COUNT(*) AS failures
  FROM events
  WHERE category = 'authentication' AND outcome = 'failure'
  GROUP BY src_ip
  HAVING COUNT(DISTINCT user_name) >= :min_users
clickhouse_sql: |
  SELECT src_ip, countDistinct(user_id) AS distinct_users, count() AS failures
  FROM blueteam.events
  WHERE tenant_id = {tenant_id:String} AND category = 'authentication' AND outcome = 'failure'
  GROUP BY src_ip
  HAVING distinct_users >= {min_users:UInt32}

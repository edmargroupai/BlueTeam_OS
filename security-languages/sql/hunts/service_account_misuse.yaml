id: sql.identity.service_account_misuse
name: Service-account misuse hunt
description: Interactive or burst authentication by accounts named like services.
security_domain: identity
required_fields: [user_name, category]
MITRE_mapping: [T1078.001]
performance_expectation: p95 under 2s
version: 1.0.0
parameters: []
defaults: {}
test_fixture: null
sql: |
  SELECT user_name, COUNT(*) AS events
  FROM events
  WHERE category = 'authentication'
    AND (
      lower(user_name) LIKE '%svc%'
      OR lower(user_name) LIKE '%service%'
      OR lower(user_name) LIKE 'sa-%'
    )
  GROUP BY user_name
clickhouse_sql: |
  SELECT user_id AS user_name, count() AS events
  FROM blueteam.events
  WHERE tenant_id = {tenant_id:String}
    AND category = 'authentication'
    AND (
      positionCaseInsensitive(user_id, 'svc') > 0
      OR positionCaseInsensitive(user_id, 'service') > 0
      OR startsWith(user_id, 'sa-')
    )
  GROUP BY user_id

id: br-endpoint-office-c2
family: endpoint
name: Office PowerShell then external beacon
description: >
  Word launches encoded PowerShell, then the same host beacons to an external IP.
  Expected detections include Office-to-shell, encoded PowerShell, process-network
  chain, and repetitive beacon.
attack_techniques:
  - T1059.001
  - T1027
  - T1071
max_detection_latency_seconds: 5
allowed_false_positive_envelope: 0
expected_event_count: 5
expected_mitre:
  - T1059.001
  - T1071
expected_detections:
  - rule_id: sigma.office-spawns-powershell
    min_count: 1
  - rule_id: endpoint.office_spawns_shell
    min_count: 1
  - rule_id: endpoint.encoded_powershell
    min_count: 1
  - rule_id: endpoint.process_network_chain
    min_count: 1
  - rule_id: network.repetitive_beacon
    min_count: 1

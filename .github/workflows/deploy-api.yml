name: Deploy API image

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "packages/**"
      - "detections/**"
      - "infra/docker/Dockerfile.api"
      - "scripts/**"
      - "fly.toml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/blueteam-os-api:latest
            ghcr.io/${{ github.repository_owner }}/blueteam-os-api:${{ github.sha }}

# Blue Team OS — FastAPI control plane on Fly.io
# Deploy: flyctl deploy

app = "blueteam-os-api"
primary_region = "iad"

[build]
  dockerfile = "infra/docker/Dockerfile.api"

[env]
  BTOS_ENV = "production"
  BTOS_API_HOST = "0.0.0.0"
  BTOS_API_PORT = "8080"
  BTOS_AI_ENABLED = "false"
  BTOS_DEV_SEED = "true"
  BTOS_WEB_ORIGIN = "https://blueteam-os.vercel.app"
  BTOS_OBJECT_STORE_ROOT = "/tmp/objects"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "45s"
    method = "GET"
    path = "/api/v1/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
